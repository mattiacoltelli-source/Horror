name: Check Agnese integration before release
on:
  push:
    branches: [feature/nun-3d-upgrade-live]
permissions:
  contents: read
jobs:
  mobile-endings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3cfccacb58abb9d4682ea77a05b30d56f1b84d3f
          path: test-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise the integrated character and both endings
        run: |
          cp test-source/agnese-preview.html agnese-preview.html
          rm -rf test-source/tools/nun/review
          mkdir -p test-source/tools/nun/review
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/agnese-release-http.log 2>&1 &
          python test-source/tools/nun/check_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agnese-release-checks
          path: test-source/tools/nun/review/
