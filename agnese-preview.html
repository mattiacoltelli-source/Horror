<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suor Agnese · Prova personaggio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101317;color:#ebe6db;font:15px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}main{position:fixed;inset:90px 0 245px}header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 18px) 20px 12px;background:linear-gradient(#101317,transparent);pointer-events:none}h1{font-size:20px;margin:0 0 7px;font-weight:550}#status{color:#aba69d;font-size:13px;margin:0}nav{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(transparent,#101317 18%);display:grid;gap:9px;max-width:520px;margin:auto}.row{display:flex;gap:6px}button,a{font:inherit;border:1px solid #46443f;background:#1d2126;color:inherit;border-radius:9px;min-height:44px;padding:10px 12px;flex:1;text-align:center;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#e1d5b9;color:#202124;border-color:#e1d5b9}a.download{flex:0 0 auto;color:#d1c7b4;font-size:13px}#hint{position:fixed;right:20px;top:70px;color:#a5a19b;font-size:12px}button:disabled{opacity:.5}a:focus-visible,button:focus-visible{outline:2px solid #e1d5b9;outline-offset:3px}
</style>
<main><canvas aria-label="Modello 3D interattivo di Suor Agnese"></canvas></main>
<header><h1>Suor Agnese</h1><p id="status" role="status">Caricamento del modello…</p></header>
<span id="hint">Trascina per ruotare</span>
<nav aria-label="Controlli del personaggio">
<div class="row" id="versions"><button data-version="new" aria-pressed="true">Nuova</button><button data-version="original" aria-pressed="false">Originale</button></div>
<div class="row" id="views"><button data-view="body" aria-pressed="true">Figura</button><button data-view="face" aria-pressed="false">Viso</button><button data-view="hands" aria-pressed="false">Mani</button></div>
<div class="row"><button id="motion">Movimento della testa</button><a id="finale" href="index.html?start=torre&debug=1&agneseFinale=1">Prova finale</a></div>
<div class="row"><a class="download" href="assets/models/agnese/suor-agnese.glb" download>Scarica GLB</a></div>
</nav>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/three/loaders/GLTFLoader.js';
const canvas=document.querySelector('canvas');
let renderer;
try { renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false}); }
catch(error) {
  canvas.style.display='none';
  const image=document.createElement('img');
  image.src='tools/nun/review/new-front.png';
  image.alt='Render della nuova Suor Agnese';
  image.style.cssText='width:100%;height:100%;object-fit:contain;padding:0';
  document.querySelector('main').append(image);
  document.querySelector('#status').textContent='Anteprima statica · WebGL non disponibile';
  document.querySelector('#hint').textContent='';
  document.querySelectorAll('button').forEach(button=>button.disabled=true);
}
if(renderer){
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene();scene.background=new THREE.Color('#101317');
const camera=new THREE.PerspectiveCamera(37,1,.01,30);
const key=new THREE.DirectionalLight(0xdfe9ff,2.4);key.position.set(-2,3,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xffdcad,.8);fill.position.set(2,1,2);scene.add(fill);
scene.add(new THREE.HemisphereLight(0xc4cbd7,0x2a211c,.65));
const rim=new THREE.DirectionalLight(0x9db9e3,1.1);rim.position.set(1,2,-2);scene.add(rim);
const turntable=new THREE.Group();scene.add(turntable);
const loader=new GLTFLoader(), models=new Map();
let current='new', view='body', mixer=null, action=null, request=0;
const status=document.querySelector('#status');
const paths={new:'assets/models/agnese/suor-agnese.glb',original:'assets/models/c_nurse.glb'};
function frame(){
  const portrait=innerWidth<innerHeight;
  const framing={body:[1.13,portrait?3.9:4.7],face:[1.83,portrait?.85:1.15],hands:[1.02,portrait?2.6:2.7]}[view];
  camera.position.set(0,framing[0],framing[1]);camera.lookAt(0,framing[0],0);
}
async function select(version){
  const id=++request;status.textContent='Caricamento del modello…';
  try{
    if(!models.has(version))models.set(version,await loader.loadAsync(paths[version]));
    if(id!==request)return;
    mixer?.stopAllAction();turntable.clear();turntable.rotation.y=0;
    const {scene:model,animations}=models.get(version);
    model.scale.setScalar(1);model.position.set(0,0,0);model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3());
    const scale=2/(box.max.y-box.min.y);model.scale.setScalar(scale);
    model.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);
    turntable.add(model);mixer=new THREE.AnimationMixer(model);action=null;
    const idle=animations.find(c=>c.name==='Idle');if(idle)mixer.clipAction(idle).play();
    current=version;frame();
    status.textContent=version==='new'?'Avorio invecchiato · 12 ossa · 3 animazioni':'Modello originale';
    document.querySelector('#motion').disabled=!animations.length;
    document.querySelector('#finale').href='index.html?start=torre&debug=1&agneseFinale=1'+(version==='original'?'&agnese=original':'');
    document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.version===version));
  }catch(error){status.textContent='Caricamento fallito. Ricarica la pagina.';console.error(error)}
}
document.querySelector('#versions').addEventListener('click',e=>{if(e.target.dataset.version)select(e.target.dataset.version)});
document.querySelector('#views').addEventListener('click',e=>{if(!e.target.dataset.view)return;view=e.target.dataset.view;frame();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view))});
document.querySelector('#motion').addEventListener('click',()=>{const clip=models.get(current)?.animations.find(c=>c.name==='HeadTurn');if(!clip)return;action=mixer.clipAction(clip);action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=false;action.reset().play()});
let pointer=null;
canvas.addEventListener('pointerdown',e=>{pointer=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(pointer===null)return;turntable.rotation.y+=(e.clientX-pointer)*.009;pointer=e.clientX});
canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);
function resize(){const area=document.querySelector('main').getBoundingClientRect();renderer.setSize(area.width,area.height,false);camera.aspect=area.width/area.height;camera.updateProjectionMatrix();frame()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{mixer?.update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)});
window.__agneseReview={scene,renderer,camera,get mixer(){return mixer},get model(){return models.get(current)?.scene}};
select('new');
}
</script>
</html>
