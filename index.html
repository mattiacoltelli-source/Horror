<!doctype html>
<html lang="it">

<meta name="theme-color" content="#000000">

<title>NON GIRARTI</title>
<link rel="stylesheet" href="css/style.css">

<body>

<div id="vignette"></div>
<div id="grain"></div>

<section id="intro" class="screen">

    <h1>NON<br>GIRARTI</h1>

<section id="rotate" class="screen hidden"><p>Ruota il telefono<br>in verticale</p></section>

  <div class="intro-inner"><p class="tag">in pausa</p><button id="resume" type="button">CONTINUA</button></div>
</section>

<section id="end" class="screen hidden">
  <div class="intro-inner"><p class="tag" id="endtext">fine</p><p class="small" id="endsub"></p><button id="again" type="button">RIPROVA</button></div>
