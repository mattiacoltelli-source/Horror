<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NON GIRARTI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="NON GIRARTI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="vignette"></div>
<div id="grain"></div>
<div id="fade"></div>

<div id="sig" aria-hidden="true"><i></i></div>
<div id="stick" aria-hidden="true"><i></i></div>
<div id="subtitle"></div>
<button id="act" class="hidden" type="button">APRI</button>
<i id="dot" class="hidden" aria-hidden="true"></i>
<button id="fire" class="hidden rnd" type="button">SPARA</button>

<section id="intro" class="screen">
  <div class="intro-inner">
    <h1>NON<br>GIRARTI</h1>
    <p class="tag"><span>Usa le cuffie.</span><span>Gioca al buio.</span><span>Non sei solo.</span></p>
    <button id="enter" type="button">ENTRA NEL GIOCO</button>
    <p id="loadmsg" class="small">caricamento…</p>
    <button id="install" class="hidden linkbtn" type="button">installa l'app</button>
    <p id="ver" class="ver"></p>
  </div>
</section>

<script>
// Messaggi di caricamento criptici (cambiano a ogni apertura). Nessun ritardo finto: spariscono appena il gioco e' pronto.
(function () {
  var el = document.getElementById('loadmsg'); if (!el) return;
  var M = ['paziente n. 17, in attesa.', 'ti stavano aspettando.', 'non voltarti ancora.', 'la luce regge. ancora per poco.', 'qualcuno ha già aperto la porta.', 'conta i passi. sono sempre uno in più.', 'lo specchio non c\'era, prima.', 'respira piano.', 'il corridoio è più lungo di come lo ricordi.', 'ricordi la tua faccia?', 'non sei il primo a entrare.', 'nessuno ti ha sentito arrivare.', 'tieni accesa la torcia.', 'non guardare dietro, qualunque cosa senta.'];
  for (var i = M.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = M[i]; M[i] = M[j]; M[j] = t; }
  var n = 0, timer = null, still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(txt) { el.textContent = txt; if (still) return; el.classList.add('glitch'); setTimeout(function () { el.classList.remove('glitch'); }, 260); }
  show(M[0]); el.classList.add('flick');
  timer = setInterval(function () { n = (n + 1) % M.length; show(M[n]); }, 2600);
  // il titolo si guasta per un istante ogni 2,5 secondi (solo finche' la pagina iniziale e' visibile)
  (function tg() { setTimeout(function () { var h = document.querySelector('#intro h1'), intro = document.getElementById('intro'); if (h && intro && !intro.classList.contains('hidden') && !still) { h.classList.add('tglitch'); setTimeout(function () { h.classList.remove('tglitch'); }, 240); } if (intro && !intro.classList.contains('hidden')) tg(); }, 2500); })();
  window.__loadMsgStop = function () { clearInterval(timer); el.classList.remove('flick', 'glitch'); };
})();
</script>

<section id="rotate" class="screen hidden"><p>Ruota il telefono<br>in verticale</p></section>

<section id="pause" class="screen hidden">
  <div class="intro-inner"><p class="tag">in pausa</p><button id="resume" type="button">CONTINUA</button></div>
</section>

<section id="end" class="screen hidden">
  <div class="intro-inner"><p class="tag" id="endtext">fine</p><p class="small" id="endsub"></p><button id="again" type="button">RIPROVA</button></div>
</section>

<div id="upd" class="hidden" role="status"><span>Aggiornamento disponibile</span><button id="updgo" type="button">AGGIORNA</button></div>

<script type="module" src="js/pwa.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
